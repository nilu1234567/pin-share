<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Share - View Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #11998e;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .message-box {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid #11998e;
        }

        .message-box p {
            color: #333;
            font-size: 16px;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .link-btn {
            display: inline-block;
            color: #11998e;
            text-decoration: underline;
            word-break: break-all;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .home-link {
            text-align: center;
            margin-top: 20px;
        }

        .home-link a {
            color: #11998e;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #11998e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>💬 Message</h1>
            <p>Shared with you via PIN Share</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Loading message...</p>
        </div>

        <div id="messageContent" style="display: none;">
            <div class="message-box" id="messageBox"></div>
            <div class="home-link">
                <a href="/">← Share something</a>
            </div>
        </div>

        <div id="errorMsg" class="error" style="display: none;">
            <p>❌ Message not found or expired</p>
        </div>
    </div>

    <script>
        const pin = window.location.pathname.split('/').pop();

        async function loadMessage() {
            try {
                const response = await fetch('/api/view/' + pin);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.message) {
                    const messageBox = document.getElementById('messageBox');
                    
                    // Check if message contains a link
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const messageWithLinks = data.message.replace(urlRegex, '<a href="$1" target="_blank" class="link-btn">$1</a>');
                    
                    messageBox.innerHTML = '<p>' + messageWithLinks + '</p>';
                    document.getElementById('messageContent').style.display = 'block';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        loadMessage();
    </script>
</body>
</html>
