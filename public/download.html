<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLink - Download File</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #11998e;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .file-preview {
            margin-top: 30px;
            padding: 30px;
            background: #e8f5e9;
            border-radius: 15px;
        }

        .file-preview h3 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .file-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .file-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .file-size {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .download-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #11998e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .error-msg h3 {
            margin-bottom: 10px;
        }

        .home-link {
            text-align: center;
            margin-top: 30px;
        }

        .home-link a {
            color: #11998e;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .home-link a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #fff3e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #e65100;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📥 ShareLink</h1>
            <p>Download your shared file</p>
        </div>

        <div class="info-box">
            <p>📎 File shared via ShareLink</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: #666;">Loading file...</p>
        </div>

        <div class="file-preview" id="filePreview" style="display: none;">
            <div class="file-icon" id="fileIcon">📄</div>
            <h3>✅ File Ready!</h3>
            <div class="file-name" id="previewFileName">document.pdf</div>
            <div class="file-size" id="previewFileSize">Size: 2.5 MB</div>
            <button class="download-btn" onclick="downloadFile()">
                ⬇️ Download File
            </button>
        </div>

        <div class="error-msg" id="errorMsg" style="display: none;">
            <h3>❌ File Not Found</h3>
            <p>The file may have expired or doesn't exist.</p>
        </div>

        <div class="home-link">
            <a href="/">← Share a file</a>
        </div>
    </div>

    <script>
        let fileId = '';
        let verifiedFile = null;

        // Get ID from URL
        fileId = window.location.pathname.split('/').pop();

        async function loadFile() {
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: fileId })
                });

                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.valid) {
                    verifiedFile = data;
                    document.getElementById('previewFileName').textContent = data.fileName;
                    document.getElementById('previewFileSize').textContent = 'Size: ' + data.fileSize;
                    document.getElementById('fileIcon').textContent = getFileIcon(data.fileName);
                    document.getElementById('filePreview').style.display = 'block';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'xls': '📗',
                'xlsx': '📗',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'txt': '📝'
            };
            return icons[ext] || '📄';
        }

        function downloadFile() {
            window.location.href = '/api/download/' + fileId;
        }

        // Auto-load on page load
        loadFile();
    </script>
</body>
</html>
